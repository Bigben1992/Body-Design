<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111216">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Body Design">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Body Design Workout</title>
<style>
:root{--bg:#0f1013;--card:#17191f;--card2:#20232b;--text:#f6f7fb;--muted:#aab0bd;--accent:#ff6fae;--line:#2e323d;--good:#62d39c}
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--text)}
header{position:sticky;top:0;z-index:20;background:rgba(15,16,19,.94);backdrop-filter:blur(18px);padding:calc(env(safe-area-inset-top) + 12px) 16px 11px;border-bottom:1px solid var(--line)}
h1{font-size:22px;margin:0}.sub{color:var(--muted);font-size:13px;margin-top:4px}
main{padding:15px 13px calc(110px + env(safe-area-inset-bottom));max-width:760px;margin:auto}
.tabs{display:flex;gap:8px;margin-bottom:13px;overflow:auto}.tab{border:1px solid var(--line);background:var(--card);color:var(--text);padding:10px 12px;border-radius:14px;white-space:nowrap}.tab.active{background:var(--accent);color:#151018;border-color:transparent;font-weight:800}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;margin-bottom:12px}.card h2{font-size:19px;margin:0 0 4px}.meta,.small{color:var(--muted);font-size:12px}.notice{font-size:12px;color:var(--muted);line-height:1.45}
.exercise{background:var(--card2);border-radius:17px;overflow:hidden;margin-top:13px;border:1px solid #292e39}.exercise-photo{width:100%;aspect-ratio:16/9;object-fit:cover;display:block;background:#111}.exercise-body{padding:13px}
.exercise-title{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}.exercise h3{margin:0;font-size:18px}.badge{font-size:11px;color:#111;background:#f5f7fb;border-radius:999px;padding:4px 8px;white-space:nowrap}.focus{color:#d7dae2;font-size:13px;line-height:1.4;margin-top:8px}
details{margin-top:9px;border-top:1px solid #333845;padding-top:8px}details summary{color:var(--accent);cursor:pointer;font-weight:700;font-size:13px}.tech-list{padding-left:19px;color:#e4e6ed;font-size:13px;line-height:1.45}.tech-list li{margin:6px 0}.mistakes{color:#f2c7d8}
.video-actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}.video-actions a,.video-actions button{border:0;text-decoration:none;background:#303545;color:white;padding:9px 10px;border-radius:11px;font-size:13px}.video-wrap{display:none;margin-top:10px;aspect-ratio:16/9}.video-wrap.show{display:block}.video-wrap iframe{width:100%;height:100%;border:0;border-radius:12px}
.prev{margin:10px 0 4px;padding:9px;background:#15171c;border-radius:11px}.suggestion{margin-top:6px;color:#d9e0ff;font-size:12px}.pr{margin-top:6px;color:var(--good);font-size:12px}
.sethead,.setrow{display:grid;grid-template-columns:36px 1fr 1fr 58px 44px;gap:6px;align-items:center}.sethead{margin-top:10px;color:var(--muted);font-size:10px;text-align:center}.setrow{margin-top:6px}
input,select,textarea{width:100%;background:#111319;border:1px solid #373c48;color:white;border-radius:10px;padding:10px 8px;font-size:15px}textarea{min-height:72px;resize:vertical}.donebtn{height:39px;border:1px solid #444b5b;border-radius:10px;background:#171a21;color:#ddd;font-size:17px}.donebtn.done{background:var(--good);color:#0b1b13;border-color:transparent}
button.primary{width:100%;border:0;border-radius:14px;background:var(--accent);color:#181019;padding:13px;font-weight:800;font-size:16px;margin-top:12px}button.secondary,.secondary{border:1px solid var(--line);background:var(--card2);color:var(--text);border-radius:12px;padding:10px 12px;text-decoration:none}.flex{display:flex;gap:8px;align-items:center;justify-content:space-between}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.bottomnav{position:fixed;bottom:0;left:0;right:0;background:rgba(15,16,19,.96);backdrop-filter:blur(16px);border-top:1px solid var(--line);padding:8px 9px calc(8px + env(safe-area-inset-bottom));display:flex;justify-content:center;gap:6px;z-index:30}.bottomnav button{flex:1;max-width:220px;border:0;background:transparent;color:var(--muted);padding:9px 4px;border-radius:11px;font-size:12px}.bottomnav button.active{color:white;background:var(--card2)}
.timer{position:fixed;left:12px;right:12px;bottom:calc(72px + env(safe-area-inset-bottom));z-index:40;background:#272b35;border:1px solid #444b5a;border-radius:16px;padding:10px 12px;display:none;box-shadow:0 8px 30px rgba(0,0,0,.4)}.timer.show{display:flex;align-items:center;gap:10px}.timer-time{font-size:25px;font-weight:900;min-width:72px}.timer-label{font-size:11px;color:var(--muted);flex:1}.timer button{border:0;background:#3a3f4d;color:white;border-radius:9px;padding:8px}
.history-item{padding:12px 0;border-bottom:1px solid var(--line)}.chart{width:100%;height:190px;background:#12141a;border-radius:14px;margin-top:10px}.statgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:10px}.stat{background:#12141a;border-radius:12px;padding:10px}.stat b{display:block;font-size:17px}.stat span{font-size:11px;color:var(--muted)}.backupbox{margin-top:12px;padding:11px;background:#14161b;border-radius:13px}
@media(max-width:430px){.sethead,.setrow{grid-template-columns:30px 1fr 1fr 50px 41px}.exercise-body{padding:11px}}
</style>
</head>
<body>
<header><h1>Body Design Workout</h1><div class="sub">Glutes 60% · Legs 40% · прогрессия по весам</div></header>
<main id="app"></main>
<div id="restTimer" class="timer"><div class="timer-time" id="timerTime">0:00</div><div class="timer-label" id="timerLabel">Отдых</div><button onclick="adjustTimer(-15)">−15</button><button onclick="adjustTimer(15)">+15</button><button onclick="stopTimer()">✕</button></div>
<nav class="bottomnav"><button id="nav-workout" class="active" onclick="showSection('workout')">🏋️ Тренировки</button><button id="nav-history" onclick="showSection('history')">🗓 История</button><button id="nav-progress" onclick="showSection('progress')">📈 Прогресс</button></nav>
<script src="workouts.js"></script><script src="app.js"></script>
</body>
</html>
